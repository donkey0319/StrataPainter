# Builds Strata for Windows, macOS and Linux and attaches the builds to a GitHub Release.
#
#   Release:   git tag v0.1.0 && git push origin v0.1.0
#   Test only: Actions tab > "Build & Release" > Run workflow (builds, no release)
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest        # Apple Silicon
            name: macos-arm64
          - os: ubuntu-22.04        # older glibc = runs on more distros
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      STRATA_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # assimp-py (FBX/glTF import) is optional: don't fail the build if a platform has no wheel.
          grep -v '^assimp-py' requirements.txt > req-core.txt
          pip install -r req-core.txt pyinstaller
          pip install "assimp-py>=1.0" || echo "::warning::assimp-py unavailable on ${{ matrix.name }}; FBX/glTF import disabled in this build"

      - name: Build
        run: pyinstaller packaging/strata.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Strata -DestinationPath "Strata-$env:STRATA_VERSION-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Strata.app "Strata-$STRATA_VERSION-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "Strata-$STRATA_VERSION-${{ matrix.name }}.tar.gz" -C dist Strata

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-${{ matrix.name }}
          path: Strata-*.*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
