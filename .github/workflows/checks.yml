name: Source syntax

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Parse application sources
        run: python -m compileall -q strata examples run.py run_batch.py
      - name: Parse packaging recipes
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in pathlib.Path('packaging').glob('*.spec')]"
